[project]
name = "paper-agent"
version = "0.1.0"
description = "AI + Biodiversity Conservation literature tracker using Pydantic AI"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai[openai]",
    "arxiv",
    "duckdb",
    "pandas",
    "httpx",
    "pyyaml",
]

[project.scripts]
paper-agent = "paper_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_agent"]

[tool.uv]
dev-dependencies = [
    "pytest",
    "ruff",
]
